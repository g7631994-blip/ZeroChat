name: Build ZeroChat APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Generar íconos launcher
        run: bash gen_icons.sh

      - name: Verificar recursos generados
        run: |
          echo "[SHADOW] Verificando mipmap..."
          find app/src/main/res/mipmap-* -type f | sort

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Empaquetar APK en ZIP
        if: success()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/zerochat-debug.apk
          cd release
          zip zerochat-debug-apk.zip zerochat-debug.apk

      - name: Subir APK compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerochat-debug-apk
          path: release/zerochat-debug-apk.zip
          retention-days: 14

      - name: Subir logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            ~/.gradle/daemon/**
          retention-days: 7
