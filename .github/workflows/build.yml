name: ZeroChat – Build Funcional SHΔDØW
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar Proyecto ZeroChat Completo
        run: |
          # ============================================================
          # ESTRUCTURA DE DIRECTORIOS
          # ============================================================
          mkdir -p app/src/main/java/com/zeroclone/app/{domain/{model,repository,usecase},data/{datasource/local,repository},di,presentation/{navigation,theme,screen/{login,chat,webview}}}
          mkdir -p app/src/main/res/{values,mipmap-hdpi}
          mkdir -p gradle/wrapper

          # ============================================================
          # GRADLE WRAPPER & PROPERTIES
          # ============================================================
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # ============================================================
          # ROOT BUILD.GRADLE.KTS
          # ============================================================
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.22" apply false
          }
          EOF

          # ============================================================
          # SETTINGS.GRADLE.KTS (CORREGIDO)
          # ============================================================
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZeroChat"
          include(":app")
          EOF

          # ============================================================
          # APP BUILD.GRADLE.KTS (SINTAXIS CORREGIDA)
          # ============================================================
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.zeroclone.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.zeroclone.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  vectorDrawables { useSupportLibrary = true }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2")
              implementation("androidx.datastore:datastore-preferences:1.1.0")
              implementation("io.insert-koin:koin-android:3.5.3")
              implementation("io.insert-koin:koin-androidx-compose:3.5.3")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
          }
          EOF

          touch app/proguard-rules.pro

          # ============================================================
          # ANDROIDMANIFEST.XML
          # ============================================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:name=".ZeroChatApplication"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ZeroChat">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.ZeroChat">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".presentation.screen.webview.WebViewActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # ============================================================
          # DOMAIN LAYER
          # ============================================================
          cat > app/src/main/java/com/zeroclone/app/domain/model/Provider.kt << 'EOF'
