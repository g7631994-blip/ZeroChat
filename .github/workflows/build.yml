          cat > app/src/main/java/com/zeroclone/app/domain/model/Chat.kt << 'EOF'
          package com.zeroclone.app.domain.model

          import kotlinx.serialization.Serializable

          @Serializable
          data class Chat(
              val id: String = java.util.UUID.randomUUID().toString(),
