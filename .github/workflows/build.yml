          cat > app/src/main/java/com/zeroclone/app/presentation/screen/chat/ChatViewModel.kt << 'EOF'
          package com.zeroclone.app.presentation.screen.chat

          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.zeroclone.app.domain.model.Chat
          import com.zeroclone.app.domain.model.Message
          import com.zeroclone.app.domain.model.Role
          import com.zeroclone.app.domain.repository.ChatRepository
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.launch

          class ChatViewModel(private val repo: ChatRepository) : ViewModel() {
              private val _chat = MutableStateFlow<Chat?>(null)
              val chat: StateFlow<Chat?> = _chat

              fun init(providerName: String) {
                  viewModelScope.launch {
                      repo.observeChats().collect { list ->
                          val existing = list.find { it.providerName == providerName }
                          _chat.value = existing ?: repo.createChat(providerName, "default")
                      }
                  }
              }

              fun send(text: String) {
                  val c = _chat.value ?: return
                  viewModelScope.launch {
                      repo.addMessage(c.id, Message(role = Role.USER, content = text))
                      repo.generateResponse(c.id, text)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/presentation/screen/chat/ChatScreen.kt << 'EOF'
          package com.zeroclone.app.presentation.screen.chat

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.unit.dp
          import com.zeroclone.app.domain.model.Message
          import com.zeroclone.app.domain.model.Role
          import org.koin.androidx.compose.koinViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChatScreen(providerName: String, vm: ChatViewModel = koinViewModel()) {
              LaunchedEffect(providerName) { vm.init(providerName) }
              val chat by vm.chat.collectAsState()
              var input by remember { mutableStateOf("") }

              Scaffold(
                  topBar = { TopAppBar(title = { Text(providerName) }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)) },
                  bottomBar = {
                      Surface(shadowElevation = 8.dp) {
                          Row(Modifier.padding(12.dp).fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              OutlinedTextField(input, { input = it }, Modifier.weight(1f), placeholder = { Text("Mensaje...") }, shape = RoundedCornerShape(24.dp), maxLines = 4)
                              Spacer(Modifier.width(8.dp))
                              IconButton({ if (input.isNotBlank()) { vm.send(input.trim()); input = "" } }) { Icon(Icons.Default.Send, null, tint = MaterialTheme.colorScheme.primary) }
                          }
                      }
                  }
              ) { p ->
                  LazyColumn(Modifier.padding(p).fillMaxSize().padding(horizontal = 16.dp, vertical = 8.dp), reverseLayout = true) {
                      chat?.messages?.reversed()?.let { msgs ->
                          items(msgs, key = { it.id }) { msg ->
                              val isUser = msg.role == Role.USER
                              Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start) {
                                  Surface(Modifier.widthIn(max = 300.dp).clip(RoundedCornerShape(16.dp)), color = if (isUser) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surfaceVariant) {
                                      Text(msg.content, Modifier.padding(12.dp), color = if (isUser) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

