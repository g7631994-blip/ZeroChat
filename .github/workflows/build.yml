          cat > app/src/main/java/com/zeroclone/app/presentation/screen/webview/WebViewActivity.kt << 'EOF'
          package com.zeroclone.app.presentation.screen.webview

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.viewinterop.AndroidView
          import com.zeroclone.app.domain.model.Provider
          import com.zeroclone.app.domain.usecase.ExtractTokenUseCase
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.launch
          import org.koin.android.ext.android.inject

          class WebViewActivity : ComponentActivity() {
              private val extractUseCase: ExtractTokenUseCase by inject()

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val providerName = intent.getStringExtra("PROVIDER") ?: return finish()
                  val provider = Provider.valueOf(providerName)

                  setContent {
                      var extracted by remember { mutableStateOf(false) }
                      Scaffold(topBar = { TopAppBar(title = { Text("Auth: ${provider.displayName}") }) }) { p ->
                          AndroidView(Modifier.fillMaxSize().padding(p), factory = { ctx ->
                              WebView(ctx).apply {
                                  settings.javaScriptEnabled = true
                                  settings.domStorageEnabled = true
                                  webViewClient = object : WebViewClient() {
                                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?) = false
                                      override fun onPageFinished(view: WebView?, url: String?) {
                                          if (!extracted && url?.contains(provider.url.substringAfter("//")) == true) {
                                              MainScope().launch {
                                                  // JS Bridge: Extrae localStorage y sessionStorage como JSON
                                                  val js = "(function(){try{return JSON.stringify({ls:localStorage,ss:sessionStorage})}catch(e){return '{}'}})()"
                                                  evaluateJavascript(js) { result ->
                                                      val clean = result?.removeSurrounding("\"")?.replace("\\\"", "\"")
                                                      extractUseCase(provider, clean)
                                                      extracted = true
                                                      finish()
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  loadUrl(provider.url)
                              }
                          })
                      }
                  }
              }
          }
          EOF

          # ============================================================
          # MAIN ACTIVITY & RESOURCES
          # ============================================================
          cat > app/src/main/java/com/zeroclone/app/MainActivity.kt << 'EOF'
          package com.zeroclone.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Surface
          import androidx.compose.ui.Modifier
          import androidx.navigation.compose.rememberNavController
          import com.zeroclone.app.presentation.navigation.ZeroNavGraph
          import com.zeroclone.app.presentation.theme.ZeroChatTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      ZeroChatTheme {
                          Surface(Modifier.fillMaxSize()) {
                              ZeroNavGraph(rememberNavController())
                          }
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">ZeroChat</string></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.ZeroChat" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          # Icono dummy para evitar error de recurso faltante
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Construir APK Debug
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug --no-daemon

      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zerochat-functional-debug
          path: app/build/outputs/apk/debug/app-debug.apk
