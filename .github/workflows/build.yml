          EOF

          cat > app/src/main/java/com/zeroclone/app/domain/repository/AuthRepository.kt << 'EOF'
          package com.zeroclone.app.domain.repository

          import com.zeroclone.app.domain.model.Provider

          interface AuthRepository {
              suspend fun saveToken(provider: Provider, token: String)
              suspend fun getToken(provider: Provider): String?
              suspend fun hasToken(provider: Provider): Boolean
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/domain/repository/ChatRepository.kt << 'EOF'
          package com.zeroclone.app.domain.repository

          import com.zeroclone.app.domain.model.Chat
          import com.zeroclone.app.domain.model.Message
          import kotlinx.coroutines.flow.Flow

          interface ChatRepository {
              fun observeChats(): Flow<List<Chat>>
              suspend fun createChat(providerName: String, model: String): Chat
              suspend fun addMessage(chatId: String, message: Message)
              suspend fun generateResponse(chatId: String, userContent: String): Message
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/domain/usecase/ExtractTokenUseCase.kt << 'EOF'
          package com.zeroclone.app.domain.usecase

          import com.zeroclone.app.domain.model.Provider
          import com.zeroclone.app.domain.repository.AuthRepository

          class ExtractTokenUseCase(private val authRepository: AuthRepository) {
              suspend operator fun invoke(provider: Provider, rawJson: String?): Result<Unit> {
                  if (rawJson.isNullOrBlank()) return Result.failure(Exception("Empty storage"))
                  // Lógica simplificada: buscamos cualquier valor tipo token en el JSON
                  val tokenRegex = Regex(""""(?:token|access_token|jwt)"\s*:\s*"([^"]{20,})"""")
                  val match = tokenRegex.find(rawJson)
                  val token = match?.groupValues?.get(1) ?: rawJson.take(50) // Fallback demo
                  
                  return if (token.isNotBlank()) {
                      authRepository.saveToken(provider, token)
                      Result.success(Unit)
                  } else {
                      Result.failure(Exception("No valid token found in storage"))
                  }
              }
          }
          EOF

          # ============================================================
          # DATA LAYER
          # ============================================================
          cat > app/src/main/java/com/zeroclone/app/data/datasource/local/TokenStorage.kt << 'EOF'
          package com.zeroclone.app.data.datasource.local

          import android.content.Context
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey

          class TokenStorage(context: Context) {
              private val masterKey = MasterKey.Builder(context)
                  .setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build()

              private val prefs = EncryptedSharedPreferences.create(
                  context, "zero_tokens_secure", masterKey,
                  EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                  EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
              )

              fun save(key: String, value: String) = prefs.edit().putString(key, value).apply()
              fun get(key: String): String? = prefs.getString(key, null)
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/data/datasource/local/ChatLocalDataSource.kt << 'EOF'
          package com.zeroclone.app.data.datasource.local

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import com.zeroclone.app.domain.model.Chat
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json

          val Context.chatDataStore by preferencesDataStore(name = "chats_v1")

          class ChatLocalDataSource(private val context: Context) {
              private val json = Json { ignoreUnknownKeys = true }
              private val KEY = stringPreferencesKey("all_chats")

              val chats: Flow<List<Chat>> = context.chatDataStore.data.map { prefs ->
                  prefs[KEY]?.let { json.decodeFromString<List<Chat>>(it) } ?: emptyList()
              }

              suspend fun save(chats: List<Chat>) {
                  context.chatDataStore.edit { it[KEY] = json.encodeToString(chats) }
              }
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/data/repository/AuthRepositoryImpl.kt << 'EOF'
          package com.zeroclone.app.data.repository

          import com.zeroclone.app.data.datasource.local.TokenStorage
          import com.zeroclone.app.domain.model.Provider
          import com.zeroclone.app.domain.repository.AuthRepository

          class AuthRepositoryImpl(private val storage: TokenStorage) : AuthRepository {
              override suspend fun saveToken(provider: Provider, token: String) = storage.save(provider.name, token)
              override suspend fun getToken(provider: Provider): String? = storage.get(provider.name)
              override suspend fun hasToken(provider: Provider): Boolean = storage.get(provider.name) != null
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/data/repository/ChatRepositoryImpl.kt << 'EOF'
          package com.zeroclone.app.data.repository

          import com.zeroclone.app.data.datasource.local.ChatLocalDataSource
          import com.zeroclone.app.domain.model.Chat
          import com.zeroclone.app.domain.model.Message
          import com.zeroclone.app.domain.model.Role
          import com.zeroclone.app.domain.repository.ChatRepository
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first

          class ChatRepositoryImpl(private val local: ChatLocalDataSource) : ChatRepository {
              override fun observeChats(): Flow<List<Chat>> = local.chats

              override suspend fun createChat(providerName: String, model: String): Chat {
                  val new = Chat(providerName = providerName, model = model)
                  val current = local.chats.first()
                  local.save(listOf(new) + current)
                  return new
              }

              override suspend fun addMessage(chatId: String, message: Message) {
                  val current = local.chats.first().toMutableList()
                  val idx = current.indexOfFirst { it.id == chatId }
                  if (idx != -1) {
                      current[idx] = current[idx].copy(messages = current[idx].messages + message)
                      local.save(current)
                  }
              }

              override suspend fun generateResponse(chatId: String, userContent: String): Message {
                  // SIMULACIÓN DE BACKEND: En producción, aquí iría la llamada Retrofit a la API real
                  delay(800) // Simular latencia de red
                  val chat = local.chats.first().find { it.id == chatId }
                  val responseText = "[${chat?.providerName ?: "AI"}] Respuesta simulada para: \"$userContent\".\n\nNota: Esta app usa un backend simulado para demostración. Integra tu API Key real en ChatRepositoryImpl para producción."
                  val msg = Message(role = Role.ASSISTANT, content = responseText)
                  addMessage(chatId, msg)
                  return msg
              }
          }
          EOF

          # ============================================================
          # DI & APPLICATION
          # ============================================================
          cat > app/src/main/java/com/zeroclone/app/di/AppModule.kt << 'EOF'
          package com.zeroclone.app.di

          import com.zeroclone.app.data.datasource.local.ChatLocalDataSource
          import com.zeroclone.app.data.datasource.local.TokenStorage
          import com.zeroclone.app.data.repository.AuthRepositoryImpl
          import com.zeroclone.app.data.repository.ChatRepositoryImpl
          import com.zeroclone.app.domain.repository.AuthRepository
          import com.zeroclone.app.domain.repository.ChatRepository
          import com.zeroclone.app.domain.usecase.ExtractTokenUseCase
          import org.koin.android.ext.koin.androidContext
          import org.koin.dsl.module

          val appModule = module {
              single { TokenStorage(androidContext()) }
              single { ChatLocalDataSource(androidContext()) }
              single<AuthRepository> { AuthRepositoryImpl(get()) }
              single<ChatRepository> { ChatRepositoryImpl(get()) }
              factory { ExtractTokenUseCase(get()) }
          }
          EOF

          cat > app/src/main/java/com/zeroclone/app/ZeroChatApplication.kt << 'EOF'
